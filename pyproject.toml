[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbagentflightindicator"
version = "0.8.0"
description = "Turn an RGB keyboard into an agent status panel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mojomast" }]
keywords = ["rgb", "keyboard", "agents", "status", "indicator", "openrgb", "opencode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]

# hidapi is only needed for the Sinowealth backend; everything else is stdlib.
[project.optional-dependencies]
sinowealth = ["hidapi>=0.14"]
lamparray = ["hidapi>=0.14"]
mqtt = ["paho-mqtt>=2.0"]
all = ["hidapi>=0.14", "paho-mqtt>=2.0"]
openai = ["mcp>=1.30,<2"]

# Integration frameworks. Every adapter imports its framework lazily, so none of
# these are needed to install, run or test the core - and the tests pass with
# none of them present.
copilot = ["github-copilot-sdk>=1.0.16,<2"]
openai-agents = ["openai-agents>=0.22.3"]
pydantic-ai = ["pydantic-ai>=2.52"]
langgraph = ["langgraph>=1.2.12"]
crewai = ["crewai>=1.15.23"]
ms-agent = ["agent-framework>=1.19"]

[project.scripts]
rgi = "rgi.cli:main"

[tool.setuptools]
packages = ["rgi", "rgi.backends", "rgi.watchers", "rgi.integrations", "rgi.profiles"]

[tool.setuptools.package-data]
rgi = ["../prompts/*.md", "../plugin/*",
       "webui/*", "webui/lib/*", "webui/views/*", "webui/components/*",
       "webui/tests/fixtures/*",
       "profiles/data/*.json"]
